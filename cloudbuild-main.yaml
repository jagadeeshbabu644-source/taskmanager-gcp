substitutions:
  _REGION: us-central1
  _CLUSTER: taskmanager-cluster
  _CLUSTER_ZONE: us-central1-a
  _NAMESPACE: taskmanager
  _AR_REPO: taskmanager
  _IMAGE_NAME: taskmanager
steps:
  - name: 'maven:3.9-eclipse-temurin-17'
    id: 'build-jar'
    entrypoint: 'mvn'
    args: ['clean','package','-DskipTests','-f','app/pom.xml']
    env: ['MAVEN_OPTS=-Xmx512m']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest'
      - './app'
    waitFor: ['build-jar']
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}'
    waitFor: ['build-image']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'apply-namespace'
    args: ['apply','-f','k8s/namespace.yaml']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
    waitFor: ['push-image']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'apply-manifests'
    args:
      - 'apply'
      - '-f'
      - 'k8s/configmap.yaml'
      - '-f'
      - 'k8s/deployment.yaml'
      - '-f'
      - 'k8s/service.yaml'
      - '-f'
      - 'k8s/hpa.yaml'
      - '-f'
      - 'k8s/grafana-ingress.yaml'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
    waitFor: ['apply-namespace']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'update-image'
    args:
      - 'set'
      - 'image'
      - 'deployment/${_IMAGE_NAME}'
      - '${_IMAGE_NAME}=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '-n'
      - '${_NAMESPACE}'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
    waitFor: ['apply-manifests']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'verify-rollout'
    args:
      - 'rollout'
      - 'status'
      - 'deployment/${_IMAGE_NAME}'
      - '-n'
      - '${_NAMESPACE}'
      - '--timeout=5m'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
    waitFor: ['update-image']
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'show-pods'
    args: ['get','pods','-n','${_NAMESPACE}']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'
    waitFor: ['verify-rollout']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest'
timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM