name: Close Stale PRs
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close Stale PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const now           = new Date();
            const FOUR_HOURS_MS = 4 * 60 * 60 * 1000;
            const ONE_HOUR_MS   = 60 * 60 * 1000;

            const BOT_WARNING_MARKER  = '<!-- stale-pr-warning -->';
            const BOT_REMINDER_MARKER = '<!-- stale-pr-reminder -->';

            const { data: pullRequests } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100,
            });

            console.log(`Found ${pullRequests.length} open PR(s).`);

            for (const pr of pullRequests) {
              const prNumber  = pr.number;
              const prTitle   = pr.title;
              const labels    = pr.labels.map(l => l.name);
              const createdAt = new Date(pr.created_at);
              const ageMs     = now - createdAt;
              const ageHrs    = (ageMs / ONE_HOUR_MS).toFixed(2);

              console.log(`\n── PR #${prNumber}: "${prTitle}"`);
              console.log(`   Labels : ${labels.length ? labels.join(', ') : '(none)'}`);
              console.log(`   Draft  : ${pr.draft}`);
              console.log(`   Age    : ${ageHrs} hour(s)`);

              // ── Always skip these ──
              if (pr.draft) {
                console.log('   ⏭  Skipping — draft PR.');
                continue;
              }
              if (labels.includes('keep-open')) {
                console.log('   ⏭  Skipping — has "keep-open" label.');
                continue;
              }

              // Less than 1 hour old — too early to do anything
              if (ageMs < ONE_HOUR_MS) {
                console.log('   ⏭  Skipping — PR is less than 1 hour old.');
                continue;
              }

              // Fetch all comments
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100,
              });

              // Find bot comments
              const warningComment   = comments.find(c => c.body.includes(BOT_WARNING_MARKER));
              const reminderComments = comments.filter(c => c.body.includes(BOT_REMINDER_MARKER));
              const lastReminder     = reminderComments.at(-1);

              // Check if any human responded after the first bot comment
              const firstBotComment = warningComment ?? reminderComments[0] ?? null;
              const humanResponded  = firstBotComment
                ? comments.some(c =>
                    c.user.type !== 'Bot' &&
                    !c.user.login.includes('[bot]') &&
                    new Date(c.created_at) > new Date(firstBotComment.created_at)
                  )
                : false;

              if (humanResponded) {
                console.log('   ⏭  Skipping — human responded after warning.');
                continue;
              }

              // ── Phase 3: Close — PR is 4+ hours old and warning was already sent ──
              if (ageMs >= FOUR_HOURS_MS && warningComment) {
                console.log(`   🔒 Closing PR #${prNumber} — open 4+ hours with no response ...`);
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body: [
                    '🔒 This PR has been **automatically closed** because:',
                    '- It has been open for more than **4 hours**, and',
                    '- There was
