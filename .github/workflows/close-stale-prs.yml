name: Automated PR Cleanup

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  cleanup-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Cleanup Stale Pull Requests
        uses: actions/github-script@v7
        with:
          script: |
            const TEST_PR_NUMBERS = [101, 102];

            // ⏱️ TEST thresholds - PR open > 1 hour, inactive > 30 mins
            const WARNING_AGE_HOURS = 1;
            const WARNING_INACTIVE_MINUTES = 30;

            const CLOSE_AGE_HOURS = 1;
            const CLOSE_INACTIVE_MINUTES = 45;

            /*
            // 🚀 PRODUCTION thresholds (uncomment when done testing)
            const WARNING_AGE_HOURS = 14 * 24;
            const WARNING_INACTIVE_MINUTES = 8 * 24 * 60;

            const CLOSE_AGE_HOURS = 16 * 24;
            const CLOSE_INACTIVE_MINUTES = 10 * 24 * 60;
            */

            const EXCEPTION_LABELS = [
              "keep-open",
              "long-running",
              "blocked",
              "review-pending",
              "high-priority"
            ];

            const WARNING_LABEL = "auto-close-warning";
            const OWNER_RESPONDED_LABEL = "owner-responded";
            const now = new Date();

            const prs = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
            );

            for (const pr of prs) {

              if (!TEST_PR_NUMBERS.includes(pr.number)) {
                console.log(`Skipping PR #${pr.number}`);
                continue;
              }

              const createdAt = new Date(pr.created_at);
              const updatedAt = new Date(pr.updated_at);

              const hoursSinceCreation =
                (now - createdAt) / (1000 * 60 * 60);

              const minutesSinceUpdate =
                (now - updatedAt) / (1000 * 60);

              const labels = pr.labels.map(l => l.name);
              const hasWarning = labels.includes(WARNING_LABEL);

              console.log(`Testing PR #${pr.number}`);
              console.log(`  Open for: ${hoursSinceCreation.toFixed(2)} hours`);
              console.log(`  Inactive for: ${minutesSinceUpdate.toFixed(2)} minutes`);

              if (pr.draft) continue;

              if (labels.some(label => EXCEPTION_LABELS.includes(label))) continue;

              // Remove warning if active again (updated within 30 mins)
              if (hasWarning && minutesSinceUpdate <= WARNING_INACTIVE_MINUTES) {
                console.log(`PR #${pr.number} is active again. Removing warning.`);
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: WARNING_LABEL
                });
              }

              // ✅ Warning Stage
              if (
                hoursSinceCreation > WARNING_AGE_HOURS &&
                minutesSinceUpdate > WARNING_INACTIVE_MINUTES &&
                !hasWarning
              ) {
                console.log(`PR #${pr.number} triggering WARNING stage`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: "⚠️ TEST MODE\n\nThis PR is inactive.\n\nWill be closed soon if no updates."
                });

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: [WARNING_LABEL]
                });

                continue;
              }

              // ✅ Check if PR owner responded to warning comment
              if (hasWarning) {
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100
                  }
                );

                const warningComment = comments.find(c =>
                  c.body.includes("Will be closed soon if no updates")
                );

                if (warningComment) {
                  const warningPostedAt = new Date(warningComment.created_at);

                  const ownerReplied = comments.some(c =>
                    c.user.login === pr.user.login &&
                    new Date(c.created_at) > warningPostedAt
                  );

                  if (ownerReplied) {
                    console.log(`PR #${pr.number} owner responded. Skipping closure.`);

                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      name: WARNING_LABEL
                    });

                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      labels: [OWNER_RESPONDED_LABEL]
                    });

                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: "✅ Thanks for the update! The auto-close warning has been removed. This PR will not be closed automatically."
                    });

                    continue;
                  }
                }
              }

              // ✅ Closure Stage (ONLY if warning exists)
              if (
                hoursSinceCreation > CLOSE_AGE_HOURS &&
                minutesSinceUpdate > CLOSE_INACTIVE_MINUTES &&
                hasWarning
              ) {
                console.log(`PR #${pr.number} triggering CLOSURE stage`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: "🔴 TEST MODE\n\nClosing PR due to inactivity."
                });

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: "closed"
                });
              }
            }
