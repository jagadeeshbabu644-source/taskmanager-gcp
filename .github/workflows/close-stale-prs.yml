name: Close Stale PRs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Close Stale PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const now            = new Date();
            const ONE_DAY_MS     = 24 * 60 * 60 * 1000;
            const TEN_HOURS_MS   = 10 * 60 * 60 * 1000;

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            console.log(`Found ${pullRequests.length} open PR(s).`);

            for (const pr of pullRequests) {
              const prNumber  = pr.number;
              const prTitle   = pr.title;
              const labels    = pr.labels.map(l => l.name);
              const createdAt = new Date(pr.created_at);
              const ageMs     = now - createdAt;

              console.log(`\n── PR #${prNumber}: "${prTitle}"`);
              console.log(`   Labels : ${labels.length ? labels.join(', ') : '(none)'}`);
              console.log(`   Draft  : ${pr.draft}`);
              console.log(`   Age    : ${(ageMs / ONE_DAY_MS).toFixed(2)} day(s)`);

              if (pr.draft) {
                console.log('   ⏭  Skipping — draft PR.');
                continue;
              }

              if (labels.includes('keep-open')) {
                console.log('   ⏭  Skipping — has "keep-open" label.');
                continue;
              }

              if (ageMs < ONE_DAY_MS) {
                console.log('   ⏭  Skipping — PR is less than 1 day old.');
                continue;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const recentComment = comments.find(
                c => (now - new Date(c.created_at)) < TEN_HOURS_MS
              );

              if (recentComment) {
                console.log('   ⏭  Skipping — has a comment within the last 10 hours.');
                continue;
              }

              console.log(`   🔒 Closing PR #${prNumber} ...`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  '👋 This PR has been **automatically closed** because:',
                  '- It has been open for more than **1 day**, and',
                  '- There have been **no comments in the last 10 hours**.',
                  '',
                  'If this was closed by mistake, please reopen it and add the `keep-open` label to prevent future auto-closure.',
                ].join('\n'),
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                state: 'closed',
              });

              console.log(`   ✅ PR #${prNumber} closed (branch kept, changes NOT merged).`);
            }

            console.log('\nDone.');
