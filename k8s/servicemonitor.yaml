apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskmanager
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: taskmanager
  namespaceSelector:
    matchNames:
      - taskmanager
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
